name: Build and Release PortfolioDocumentManager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Release_version/requirements.txt

      - name: Package app (Tkinter version)
        run: |
          mkdir dist
          cp -r Release_version dist/Release_version
          cp Release_version/requirements.txt dist/
          cp README.md dist/
          cp LICENSE dist/
          cd dist
          if [ "$RUNNER_OS" == "Linux" ]; then
            tar -czvf PortfolioDocumentManager-tkinter-linux.tar.gz Release_version requirements.txt README.md LICENSE
          elif [ "$RUNNER_OS" == "macOS" ]; then
            tar -czvf PortfolioDocumentManager-tkinter-macos.tar.gz Release_version requirements.txt README.md LICENSE
          else
            powershell Compress-Archive -Path Release_version,requirements.txt,README.md,LICENSE -DestinationPath PortfolioDocumentManager-tkinter-windows.zip
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioDocumentManager-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: ignore

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioDocumentManager-windows
          path: dist/*.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.0
          name: "v2.0 - Back to the roots (Tkinter)"
          body: |
            ## 🎉 Versie 2.0 - Back to the Roots (Tkinter)
            
            **Terug naar de basis met Tkinter!** Deze versie gebruikt de betrouwbare en stabiele Tkinter GUI.
            
            ### 📦 Downloads
            Kies het bestand voor jouw platform:
            - **Windows**: `PortfolioDocumentManager-tkinter-windows.zip`
            - **macOS**: `PortfolioDocumentManager-tkinter-macos.tar.gz`
            - **Linux**: `PortfolioDocumentManager-tkinter-linux.tar.gz`
            
            ### 🚀 Installatie
            1. Download het bestand voor jouw platform
            2. Pak het archief uit
            3. Installeer dependencies: `pip install -r requirements.txt`
            4. Start de app: `python Release_version/main.py`
            
            ### ✨ Nieuwe Features
            - 📚 **Dynamische leeruitkomsten per semester**: Semester 2, 3 en 4 ondersteuning
            - ⚙️ **Instellingenmenu**: Kies je semester via Instellingen
            - 🎯 **Correcte leeruitkomsten**: Krijg altijd de juiste leeruitkomsten voor je semester
            - 🔄 **Verbeterde stabiliteit**: Robuuste tkinter-based UI
            
            ### 📝 Let op
            - De Flet-versie is on hold / gestopt voor nu
            - Deze Tkinter-versie is de aanbevolen en ondersteunde versie
            
            Inclusief requirements.txt - Direct te gebruiken na uitpakken en dependencies installeren!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: ./artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
