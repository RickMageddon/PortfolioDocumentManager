name: Build and Release PortfolioDocumentManager

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Release_version/requirements.txt
          pip install pyinstaller

      - name: Install GTK3 dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install gtk-runtime -y
        shell: powershell

      - name: Build Windows executable with PyInstaller
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onedir --windowed --name PortfolioDocumentManager --icon=icon.ico `
            --hidden-import=weasyprint `
            --collect-all weasyprint `
            --collect-all cairocffi `
            --collect-all cffi `
            Release_version/main.py
        shell: powershell

      - name: Copy GTK3 DLLs to Windows dist folder
        if: matrix.os == 'windows-latest'
        run: |
          $gtkPath = "C:\Program Files\GTK3-Runtime Win64\bin"
          $distPath = "dist\PortfolioDocumentManager"
          if (Test-Path $gtkPath) {
            Copy-Item "$gtkPath\*.dll" -Destination $distPath -Force
            Write-Host "GTK3 DLLs copied successfully"
          } else {
            Write-Host "GTK3 path not found: $gtkPath"
          }
        shell: powershell

      - name: Build Linux executable with PyInstaller
        if: matrix.os == 'ubuntu-latest'
        run: |
          pyinstaller --onefile --name PortfolioDocumentManager Release_version/main.py
        shell: bash

      - name: Build macOS executable with PyInstaller
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --onefile --name PortfolioDocumentManager Release_version/main.py
        shell: bash

      - name: Package Windows executable
        if: matrix.os == 'windows-latest'
        run: |
          Copy-Item RELEASE_README.md -Destination dist\PortfolioDocumentManager\README.md
          Copy-Item LICENSE -Destination dist\PortfolioDocumentManager\
          Copy-Item Release_version\main.py -Destination dist\PortfolioDocumentManager\
          Copy-Item Release_version\requirements.txt -Destination dist\PortfolioDocumentManager\
          Compress-Archive -Path dist\PortfolioDocumentManager\* -DestinationPath PortfolioDocumentManager-windows.zip
        shell: powershell

      - name: Package Linux executable
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p package
          cp dist/PortfolioDocumentManager package/
          chmod +x package/PortfolioDocumentManager
          cp README.md package/
          cp LICENSE package/
          cd package
          tar -czvf ../PortfolioDocumentManager-linux.tar.gz PortfolioDocumentManager README.md LICENSE
        shell: bash

      - name: Package macOS executable
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p package
          cp dist/PortfolioDocumentManager package/
          chmod +x package/PortfolioDocumentManager
          cp README.md package/
          cp LICENSE package/
          cd package
          tar -czvf ../PortfolioDocumentManager-macos.tar.gz PortfolioDocumentManager README.md LICENSE
        shell: bash

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioDocumentManager-windows
          path: PortfolioDocumentManager-windows.zip

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioDocumentManager-linux
          path: PortfolioDocumentManager-linux.tar.gz

      - name: Upload macOS artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioDocumentManager-macos
          path: PortfolioDocumentManager-macos.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "v2.0 - Back to the roots (Tkinter)"
          body: |
            ## 🎉 Versie 2.0 - Back to the Roots (Tkinter)
            
            **Standalone executables!** Geen Python installatie meer nodig - download en run!
            
            ### 📦 Downloads
            Kies het bestand voor jouw platform:
            - **Windows**: `PortfolioDocumentManager-windows.zip` - Bevat folder met executable + GTK3 libraries
            - **Linux**: `PortfolioDocumentManager-linux.tar.gz` - Bevat executable binary
            - **macOS**: `PortfolioDocumentManager-macos.tar.gz` - Bevat executable binary
            
            ### 🚀 Installatie
            
            #### Option 1: Executable (Aanbevolen)
            1. Download het bestand voor jouw platform
            2. Pak het archief uit naar een map naar keuze
            3. **Windows**: Open de `PortfolioDocumentManager` folder en dubbelklik `PortfolioDocumentManager.exe`
            4. **Linux/macOS**: Run `./PortfolioDocumentManager` in de terminal
            
            #### Option 2: Python Fallback (Als exe niet werkt)
            1. Installeer Python 3.11 of hoger
            2. Open terminal in de `PortfolioDocumentManager` folder
            3. Run: `pip install -r requirements.txt`
            4. Run: `python main.py`
            
            ### ✨ Windows - PDF Generatie werkt nu out-of-the-box!
            - GTK3 libraries zijn direct naast de .exe geplaatst
            - Geen aparte GTK3 installatie meer nodig!
            - Pak simpelweg de zip uit en run de exe - PDF generatie werkt direct
            - **Bevat ook main.py** als backup voor als de .exe problemen geeft
            
            ### ✨ Nieuwe Features
            - 📚 **Dynamische leeruitkomsten per semester**: Semester 2, 3 en 4 ondersteuning
            - ⚙️ **Instellingenmenu**: Kies je semester via Instellingen
            - 🎯 **Correcte leeruitkomsten**: Krijg altijd de juiste leeruitkomsten voor je semester
            - 🔄 **Verbeterde stabiliteit**: Robuuste tkinter-based UI
            - 🚀 **Standalone executable**: Geen Python installatie nodig!
            
            ### 📝 Let op
            - De Flet-versie is on hold / gestopt voor nu
            - Deze Tkinter-versie is de aanbevolen en ondersteunde versie
            - Alle dependencies zijn ingebouwd in de executable
          files: ./artifacts/**/*
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
